<!doctype html>
<html><head><meta charset="utf-8"><title>Bamboo Scroll — art contact sheet</title><style>
body{margin:0;background:#222;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px}
figure{margin:0;position:relative}
img{width:100%;display:block}
span{position:absolute;top:4px;left:4px;background:#000c;color:#fff;font:11px monospace;padding:2px 6px}
</style></head><body>
<script src="../content/ep01.js"></script>
<script src="../content/ep02.js"></script>
<script src="../content/ep03.js"></script>
<script src="../content/ep04.js"></script>
<script>
// the served derivatives, not the local png masters: this sheet is what readers get
const arts=[].concat(...[EP01,EP02,EP03,EP04].map((e)=>e.panels.map((p)=>p.art)));
document.body.innerHTML=arts.map((a)=>`<figure><img loading="lazy" src="../${a.replace(/\.png$/,".webp")}"><span>${a}</span></figure>`).join("");
</script>
</body></html>
